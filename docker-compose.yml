services:
  # Layanan Aplikasi (PHP + FrankenPHP Server)
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      # Sinkronisasi kode proyek Anda ke dalam kontainer
      - ./:/app
    ports:
      # Akses aplikasi dari browser melalui http://localhost:8000
      - "8081:80"
      # Port untuk HTTPS jika dibutuhkan
      - "8443:443"
    depends_on:
      - db
    networks:
      - laravel

  # Layanan Database (MySQL)
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      # Menyimpan data database secara persisten
      - db_data:/var/lib/mysql
    ports:
      # Akses database dari luar (misal: TablePlus) melalui port 3306
      - "3306:3306"
    networks:
      - laravel

  # Layanan Frontend (Node.js untuk npm run dev)
  node:
    image: node:22-alpine
    container_name: laravel_node
    working_dir: /app
    volumes:
      # Sinkronisasi kode proyek Anda ke dalam kontainer
      - ./:/app
    command: >
      sh -c "npm install && npm run dev"
    ports:
      # Port default untuk Vite (npm run dev)
      - "5173:5173"
    networks:
      - laravel

# Definisi Jaringan & Volume
networks:
  laravel:
    driver: bridge

volumes:
  db_data:
    driver: local
